# Track corpus for voice-extraction validation. Each entry specifies
# a YouTube search query (resolved via yt-dlp ytsearch), excerpt range
# to keep, and expected voice-count bounds used by the test suite.
#
# To regenerate: `uv run python -m tests.rip_corpus`
#
# 2026-05-13: W-community voice extraction (Phase 4.3) restores
# musical voice counts WITH the Lerud 2014 cascade still on. The
# cascade (gammatone → brainstem → pitch) enriches the pitch bank with
# FFR-style harmonics + combination tones; voice extraction now merges
# those harmonics back into their fundamental by clustering on the
# LEARNED Hebbian W (Kim & Large 2021 Eq. 26) — the time-integrated
# evidence that two oscillators are the same source's overtones, which
# survives the per-window envelope decoupling that defeated the older
# envelope-correlation merge. Result: dense electronic tracks now run
# ~3-5 simultaneous voices (matching the pre-cascade musical baseline)
# instead of the 10-13 the naive post-cascade extractor produced.
# Bounds below are honest musical bounds, tightened back from the
# inflated values that masked the over-clustering.

[[track]]
slug = "four_tet_angel_echoes"
artist = "Four Tet"
title = "Angel Echoes"
query = "Four Tet Angel Echoes"
start_sec = 60
duration_sec = 90
expected_voices_min = 2
expected_voices_max = 7
notes = "Dense layered melodic textures — multiple simultaneous voices"

