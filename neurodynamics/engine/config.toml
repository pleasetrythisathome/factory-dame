# Engine configuration. Equivalent EDN can be added for Clojure consumers later.

[audio]
input_file = "test.wav"
# Internal processing sample rate. Lower = faster. 16 kHz captures up to ~7 kHz
# which covers the pitch band we care about (30 Hz – 4 kHz).
sample_rate = 16000

[cochlea]
# Gammatone filterbank spanning pitch + rhythm-relevant bands.
n_channels = 64
low_hz = 30.0
high_hz = 4000.0

[rhythm_grfnn]
# Slow oscillators covering musical tempos and sub-beat divisions.
# 0.5–10 Hz = 30–600 BPM equivalent range.
n_oscillators = 50
low_hz = 0.5
high_hz = 10.0
# Integration step (seconds). Must be small relative to fastest oscillator period.
dt = 0.002
# Hopf parameters. alpha closer to zero = closer to bifurcation = stronger
# resonance to weak inputs (onset trains are sparse).
alpha = -0.02
beta1 = -1.0
beta2 = -1.0
delta1 = 0.0
delta2 = 0.0
epsilon = 1.0
# Input coupling gain. Calibrated for canonical input form where max
# input is bounded by 1/√ε ≈ 1 at ε=1. Linear regime previously used
# gain=80 because the linear drive multiplied tiny onset spikes by a
# big factor without ceiling; canonical input ALWAYS saturates above
# its 1/√ε pole. gain=2 gives meaningful drive into the resonance
# region without permanently saturating every oscillator.
input_gain = 2.0
# Canonical nonlinear input (P(ε,x)·A(ε,z̄)) + integer-ratio coupling.
# Needed for the missing-pulse phenomenon (Tal 2017): the bank must
# generate cross-frequency resonance at the perceived pulse even when
# stimulus energy is at off-pulse subdivisions. Without these, the
# rhythm bank is essentially a linear filterbank and can't reproduce
# Tal 2017's MEG findings.
nonlinear_input = true

[rhythm_grfnn.coupling]
# Cross-tempo integer-ratio coupling — enables missing-pulse
# emergence. Default gain modest so the bank doesn't self-resonate
# in silence; sufficient to mode-lock perceived pulses.
enabled = true
gain = 0.3
tolerance_semitones = 1.0
max_octave_distance = 4.0

[rhythm_grfnn.hebbian]
# Attunement: weights between co-active rhythm oscillators strengthen over
# time, forming learned rhythmic attractors (familiar grooves). When enabled,
# the final W matrix is saved to output/<audio_stem>.weights.npz.
enabled = true
learn_rate = 0.5
weight_decay = 0.05

[rhythm_grfnn.delay]
# Strong anticipation: self-coupled delayed feedback lets the rhythm network
# phase-lead the driver. tau = delay in seconds (0 disables). A 100ms delay
# is roughly the feedback latency for hand-tapping experiments in the paper.
tau = 0.1
gain = 0.2

[rhythm_grfnn.noise]
# Small stochastic kicks per step. Keeps oscillators lively and breaks
# symmetry. Typical useful range: 0.001 – 0.05.
amp = 0.02
seed = 0

[motor_grfnn]
# Two-layer pulse network (Harding/Kim/Large 2025 Fig. 4): a second
# rhythm-scale GrFNN modeling motor-cortex prediction, bidirectionally
# coupled to the sensory rhythm layer. Sustains pulse activity across
# audio silences and reinforces the felt beat.
#
# ASHLE motor (Roman et al. 2023): each motor oscillator's natural
# frequency adapts toward the rate of sensory activity it sees, with
# elasticity pulling back to its initial log-spaced rate. This lets
# the motor layer track tempo changes within ~few cycles per Roman
# 2023, mimicking the human "drift toward preferred tempo" effect.
enabled = true
n_oscillators = 50
low_hz = 0.5
high_hz = 10.0
dt = 0.002
alpha = -0.05
beta1 = -1.0
beta2 = -1.0
delta1 = 0.0
delta2 = 0.0
epsilon = 1.0
input_gain = 1.0
# ASHLE adaptive natural frequency (Roman 2023):
adaptive_frequency = true
adaptive_lambda_freq = 4.0      # Hebbian frequency-tracking rate
adaptive_lambda_elastic = 2.0   # elasticity pull toward initial f_0
adaptive_freq_min_ratio = 0.5
adaptive_freq_max_ratio = 2.0
# Forward (sensory → motor): sensory.z on mastered material peaks
# nearer ~0.5 (not the 0.15 an earlier tuning assumed), so with the
# original forward_gain=0.3 motor sat at its Hopf limit cycle the
# entire track. Retuned 0.3 → 0.1 (2026-04-16) so motor breathes
# with the sensory drive rather than saturating.
# Backward (motor → sensory): very small so the feedback modulates
# rather than driving sensory into saturation.
forward_gain = 0.1
backward_gain = 0.03

[pitch_grfnn]
# n_oscillators is ignored when [pitch_grfnn.tuning] is set — the grid
# is derived from low_hz, high_hz, and bins_per_semitone to land on
# 12-TET note frequencies. With defaults below: 20 Hz (audibility
# floor + sub-bass + phantom/subharmonic region) to C8 (4186 Hz) at
# 3 bins/semitone ≈ 278 bins.
n_oscillators = 278
low_hz = 20.0
high_hz = 4186.0
dt = 0.0000625   # 16 kHz rate
# Per-oscillator τ scaling: when true, multiplies (α, β1, β2, drive)
# by f_n / tau_reference_hz. Effect: each oscillator integrates over
# ~1/|α| natural-frequency cycles — i.e., the same number of cycles
# regardless of freq, which is the canonical NRT form.
# Public domain (US 7,376,562, expired Nov 2024).
#
# Disabled by default: tier A/B/C measurement showed mixed effects.
# Wins: phantom_fundamental 0% → 67%, chord_progression 42% → 67%,
# polyrhythm 13% → 23%. Regressions: quarter_notes 62% → 0%,
# harmonic_stack 25% → 0%, live throughput 1.12× → 0.56× realtime
# (below the live threshold). The downstream voice clusterer's
# thresholds are calibrated for the un-scaled engine; a clean
# integration of per-osc τ likely needs co-tuning of noise_floor,
# active_fraction, and probably input_gain. Kept here as
# infrastructure — re-enable to experiment, then sweep voice-
# extraction params alongside.
per_oscillator_tau = true
tau_reference_hz = 1.0
# Canonical NRT nonlinear input form P(ε,x)·A(ε,z̄). Replaces the
# linear `+ x` drive with the resonant-input transformation from
# Large 2010 Eq. 15 / Lerud 2014 Eq. 2 / Kim & Large 2019 Eq. 15.
# Unlocks harmonics, subharmonics, combination tones, and integer-
# ratio mode-locking natively — the multi-frequency phenomenology
# that the entire NRT framework is built around.
#
# Validated mathematically via test_canonical_input.py (1:2, 2:1,
# 3:2 mode-locking, stability hierarchy). However, at our current
# single-layer operating amplitudes (|z| max ~0.1, |x| max ~0.5),
# canonical and linear produce indistinguishable engine state
# (quick_canonical_diff.py: relative L2 difference ≈ 0). This is
# expected — per Kim & Large 2019 Eq. 14, multi-frequency resonant
# monomials scale as ε^((k+m-2)/2)·|z|^(m-1), which is negligible
# at low |z|. The win comes when Phase 3 (multi-layer architecture)
# puts cochlear oscillators at near-saturation amplitudes where
# P·A becomes meaningfully different from linear x. Kept here as
# infrastructure for Phase 3 / Phase 5; default false until that
# regime is reached.
nonlinear_input = true
alpha = -0.05
beta1 = -1.0
beta2 = -1.0
delta1 = 0.0
delta2 = 0.0
epsilon = 1.0
# Pitch input is a (dense) band-limited audio signal. Raised from 0.1 → 0.5
# after diagnostic showed clean signals produced only ~0.003 peak amp — well
# below the extraction noise floor. With gain=0.5 and noise.amp=0 (below), a
# pure 440 Hz sine produces amp ~0.017 at the correct bin, 50× above the
# silent baseline (vs 4× in the old config), so voice clustering has real
# SNR to work with. Real music still stays comfortably below the 0.22 Hopf
# limit-cycle saturation.
input_gain = 0.5

[pitch_grfnn.tuning]
# 12-TET grid aligned to A4 = 440 Hz with 3 bins per semitone (33 cent
# spacing). Harmonics land on integer bin offsets (2f = +36, 3f ≈ +57,
# 4f = +72 bins), so the harmonic-ratio boost in voices.py sees exact
# alignment. Set a4_hz to 432, 415, etc. for pieces tuned off-reference.
a4_hz = 440.0
bins_per_semitone = 3

[pitch_grfnn.coupling]
# Internal coupling kernel D between pitch oscillators. Pre-wires
# connections at small-integer frequency ratios (1:1, 2:1, 1:2, 3:2,
# 2:3, 3:1, 1:3) within ±max_octave_distance octaves. Architecture
# component from Large's canonical NRT model.
#
# Public domain (US 7,376,562, expired Nov 2024).
#
# Disabled in single-layer config: probe_harmonic_emergence.py
# confirms the mechanism works (8× more 2:1 harmonic energy at
# gain=1.0 + canonical input vs baseline) BUT integrating into the
# single-layer pitch bank produces spurious voices — the bank
# amplifies noise into ghost oscillations indistinguishable from
# real input from voices.py's perspective. The architectural fix is
# Phase 3 (separate cochlear nonlinear layer + cortical pitch layer)
# so harmonic enrichment happens upstream of voice extraction.
# Until Phase 3 lands, keep at gain=0.
enabled = false
gain = 0.0
tolerance_semitones = 0.4
max_octave_distance = 2.5

[pitch_grfnn.hebbian]
# Attunement: weights between co-active pitch oscillators reveal implied
# tonal hierarchy and harmonic context over time.
enabled = true
learn_rate = 0.2
weight_decay = 0.02

[pitch_grfnn.delay]
# Delay coupling on the pitch network is rarely useful musically — the
# timescales are too short. Left here for symmetry and experimentation.
tau = 0.0
gain = 0.0

[brainstem_grfnn]
# Phase 3: brainstem GrFNN layer per Lerud 2014. Parallel to the
# pitch (cortical) layer — same input, different dynamics. The
# brainstem operates in the critical Hopf regime (α=0, β₁=0, β₂=-1
# per Lerud 2014 Section 3) with canonical input + integer-ratio
# coupling enabled, producing the nonlinear FFR-style harmonic +
# combination-tone enrichment that distinguishes NRT models from
# linear filterbanks.
#
# Pitch (cortex) layer stays at subcritical-DLC, simpler dynamics
# — its job is fundamental detection via mode-locking, not
# harmonic generation. Voice extraction reads pitch (where each
# fundamental shows as one peak), not brainstem (where harmonics
# also light up).
#
# Enabled by default — Phase 3 demonstrates harmonic emergence
# in the brainstem layer (canonical input + integer-ratio coupling
# at gain=0.5 in critical Hopf regime). Validated via
# `tests/test_brainstem_layer.py`: brainstem produces ~6.5×
# more 2:1 harmonic energy than the parallel pitch layer when
# driven by a pure 220 Hz tone. Broadcasts state via OSC at
# `/brainstem/*`.
enabled = true
n_oscillators = 278
low_hz = 20.0
high_hz = 4186.0
dt = 0.0000625
per_oscillator_tau = true
tau_reference_hz = 1.0
# Critical Hopf per Lerud 2014: α=0, β₁=0 (no cubic), β₂=-1.
# Only the quartic-saturating nonlinearity provides damping.
alpha = 0.0
beta1 = 0.0
beta2 = -1.0
delta1 = 0.0
delta2 = 0.0
epsilon = 0.5
input_gain = 0.5
nonlinear_input = true

[brainstem_grfnn.tuning]
a4_hz = 440.0
bins_per_semitone = 3

[brainstem_grfnn.coupling]
# Enabled with moderate gain: generates harmonics via 1:n
# resonant monomials at the brainstem stage, mirroring Lerud
# 2014's brainstem mode-locking behavior.
enabled = true
gain = 0.5
tolerance_semitones = 0.4
max_octave_distance = 2.5

[brainstem_grfnn.hebbian]
# Brainstem is feedforward-only in Lerud 2014. No learning.
enabled = false
learn_rate = 0.0
weight_decay = 0.0

[brainstem_grfnn.delay]
tau = 0.0
gain = 0.0

[brainstem_grfnn.noise]
# Same symmetry-breaker as pitch.
amp = 1e-5
seed = 2

[pitch_grfnn.noise]
# Minimal Gaussian noise per Phase 1.3 — restores symmetry breaking
# for canonical NRT multi-frequency phenomena (Kim & Large 2019:
# mode-locking from z=0 cannot bootstrap without noise) at an
# amplitude well below the voice-extraction noise floor.
#
# Equilibrium |z| under α=-0.05 damping ≈ amp / √(2|α|) ≈ 3·amp.
# At amp=1e-5, steady-state oscillator amplitude in silence ≈ 3e-5
# — three orders of magnitude below voices.py threshold (0.01) and
# 60 dB below typical drive levels. Safe symmetry-breaker.
#
# Historical context: amp=0.01 (the previous default) accumulated
# to 0.03 amplitude in silence and drowned signal. amp=1e-4 (the
# initial revised guess) was still ~0.0003 floor — borderline. 1e-5
# is the conservative re-introduction. Per US 7,376,562 (expired
# 2024-11): noise as symmetry breaker for stable fixed points.
amp = 1e-5
seed = 1

[phantom]
# Threshold for "this oscillator is resonating from memory, not drive".
# Phantom activation = |z| > amp_thresh  AND  input_envelope < drive_thresh
amp_thresh = 0.1
drive_thresh = 0.02

[state_log]
# Downsample state snapshots to this rate for disk logging.
# Rhythm network naturally runs at ~500 Hz, but 60 Hz snapshots are plenty
# for both the viewer and downstream particle/synth consumers.
snapshot_hz = 30
# Cadence (Hz) for capturing Hebbian weight matrix snapshots over time.
# 0 disables history (only the final W is saved). 2–4 Hz is plenty for
# animating the learning evolution in the viewer.
w_snapshot_hz = 2
# Output directory for state files. Each audio file produces its own
# {audio_stem}.parquet here, so repeated runs don't overwrite each other.
output_dir = "output"

[osc]
enabled = true
host = "127.0.0.1"
port = 57120   # legacy single target; router binds here too
# Broadcast at snapshot_hz. Each layer emits /rhythm/z and /pitch/z as float arrays.
#
# Additional endpoints — engine fans every message out to all of them.
# UDP doesn't share ports across receivers, so router + live viewer +
# TouchDesigner each bind their own port and the engine sends to all.

# Live viewer. nd-view --live defaults to this port.
[[osc.endpoints]]
host = "127.0.0.1"
port = 57121

# Example third subscriber (TouchDesigner, Overtone, osc.js, etc.):
# [[osc.endpoints]]
# host = "127.0.0.1"
# port = 8000

# ── Router (nd-route) ────────────────────────────────────────────
# CV / MIDI / OSC router. Subscribes to /voice/* and /features/*
# OSC emitted by nd-run, applies per-channel scaling, dispatches
# to backends. Leave cv.enabled=false until an ES-9 (or other
# DC-coupled interface) is plugged in.

[router.cv]
# Class-compliant ES-9 shows up as a 14-channel CoreAudio output.
# Leave device=null to use the system default; set to the ES-9's
# name string to pin to it. sample_rate matches the ES-9 default.
enabled = false
# device = "ES-9"
channels = 14
sample_rate = 48000
block_size = 256

[router.midi]
# mido port name. Run `python -c 'import mido; print(mido.get_output_names())'`
# to list available ports. On macOS, enable IAC Driver in Audio MIDI
# Setup to expose a virtual port like "IAC Driver Bus 1".
enabled = false
port = "IAC Driver Bus 1"

[router.osc]
# The router listens on this port; nd-run's [osc] section above
# should point here (same default 57120). To run router + SuperCollider
# simultaneously, move one to 57121.
listen_host = "127.0.0.1"
listen_port = 57120

# Additional OSC endpoints that receive a copy of every incoming
# message. Useful for chaining TouchDesigner, Overtone, etc.
# [[router.osc.forward]]
# host = "127.0.0.1"
# port = 8000

# ── Routing table ────────────────────────────────────────────────
# source = OSC path emitted by nd-run (glob * allowed in one segment)
# output = "cv/<ch>" or "midi/cc/<num>" or "midi/clock"
# scale  = "1V_per_oct" | "sawtooth_0_5V" | "unit_0_5V" | "passthrough"

# Tonic as 1V/oct — drive an external quantizer to keep the modular
# in key with the room.
[[router.mapping]]
source = "/features/key"
output = "cv/0"
scale = "1V_per_oct"

# Consonance scalar → filter cutoff CV, for example.
[[router.mapping]]
source = "/features/consonance"
output = "cv/1"
scale = "unit_0_5V"

# First tracked voice's rhythm phase → sawtooth on CV 2.
# Voice 0 is the first persistent voice identity the engine found;
# id wraps, so a wildcard would be wider but less stable per channel.
[[router.mapping]]
source = "/voice/0/rhythm/phase"
output = "cv/2"
scale = "sawtooth_0_5V"

# Voice 0's motor phase — anticipatory beat prediction → CV 3.
[[router.mapping]]
source = "/voice/0/motor/phase"
output = "cv/3"
scale = "sawtooth_0_5V"

# Consonance scalar duplicated to MIDI CC 7 for devices without CV input.
[[router.mapping]]
source = "/features/consonance"
output = "midi/cc/7"
scale = "unit_0_5V"
